name: Deploy to Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            webrtc_sessions/package-lock.json
            speed_test_server/package-lock.json

      - name: Install webrtc_sessions dependencies
        working-directory: ./webrtc_sessions
        run: npm ci

      - name: Install speed_test_server dependencies
        working-directory: ./speed_test_server
        run: npm ci

      - name: Run webrtc_sessions tests
        working-directory: ./webrtc_sessions
        run: npm test

      - name: Run speed_test_server tests
        working-directory: ./speed_test_server
        run: npm test || echo "No tests configured"

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: eyebee_web_app/package-lock.json

      - name: Install dependencies
        working-directory: ./eyebee_web_app
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        working-directory: ./eyebee_web_app
        run: npm run build
        env:
          CI: false
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: eyebee_web_app/build/
          retention-days: 3

  deploy:
    name: Deploy to Staging Server
    runs-on: ubuntu-latest
    needs: [test, build-frontend]
    environment:
      name: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: eyebee_web_app/build/

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_STAGING }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.STAGING_SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Fix remote permissions before deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SERVER_IP }} \
            'sudo chown -R $USER:$USER /opt/eyebee-staging 2>/dev/null || true'

      - name: Deploy code to staging server
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'secrets' \
            --exclude '.env' \
            --exclude 'nginx' \
            --exclude 'tmp' \
            --exclude 'temp' \
            --exclude 'logs' \
            --exclude '*.log' \
            ./ ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SERVER_IP }}:/opt/eyebee-staging/

      - name: Setup and restart services
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SERVER_IP }} << 'ENDSSH'
            set -e
            cd /opt/eyebee-staging

            # Use production template as base
            cp docker-compose.production.yml docker-compose.yml

            # Set domain for staging
            sed -i 's/VIRTUAL_HOST=.*/VIRTUAL_HOST=immersiveweb.es/' docker-compose.yml
            sed -i 's/LETSENCRYPT_HOST=.*/LETSENCRYPT_HOST=immersiveweb.es/' docker-compose.yml

            # Create/update .env
            cat > .env << EOF
          DOMAIN=immersiveweb.es
          LETSENCRYPT_EMAIL=development@immersivepro.es
          NODE_ENV=staging
          EOF

            # Fix permissions
            for dir in webrtc_sessions/node_modules speed_test_server/node_modules; do
              [ -d "$dir" ] && sudo chown -R $USER:$USER "$dir" 2>/dev/null || true
            done

            # Generate package-lock if needed
            if [ ! -f speed_test_server/package-lock.json ]; then
              cd speed_test_server && npm install && cd ..
            fi

            # Create nginx dirs
            mkdir -p nginx/vhost.d nginx/html nginx/certs nginx/acme 2>/dev/null || true

            # Pull and restart
            docker compose pull
            docker compose up -d --no-deps --build

            echo "Waiting for services..."
            sleep 15
            docker compose ps

            if docker inspect webrtc-sessions --format='{{.State.Health.Status}}' 2>/dev/null | grep -q "healthy"; then
              echo "webrtc-sessions is healthy"
            else
              echo "webrtc-sessions health check pending"
            fi
          ENDSSH

      - name: Verify deployment
        run: |
          sleep 20
          # Check via IP first
          HTTP_IP=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 http://${{ secrets.STAGING_SERVER_IP }} || echo "000")
          echo "HTTP via IP: $HTTP_IP"
          # Check via domain (may take time for SSL cert)
          HTTP_DOMAIN=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 https://immersiveweb.es || echo "000")
          echo "HTTP via domain: $HTTP_DOMAIN"
          if echo "$HTTP_IP$HTTP_DOMAIN" | grep -qE "200|301|302"; then
            echo "Staging is accessible"
          else
            echo "Staging may not be ready yet (SSL cert may still be provisioning)"
          fi

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
