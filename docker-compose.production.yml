version: '3.8'

services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./nginx/vhost.d:/etc/nginx/vhost.d
      - ./nginx/html:/usr/share/nginx/html
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - eyebee
    logging:
      options:
        max-size: "50m"

  letsencrypt:
    image: nginxproxy/acme-companion
    container_name: nginx-proxy-acme
    restart: always
    volumes_from:
      - nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./nginx/certs:/etc/nginx/certs:rw
      - ./nginx/acme:/etc/acme.sh
    environment:
      - DEFAULT_EMAIL=${LETSENCRYPT_EMAIL:-admin@eyebee.com}
    networks:
      - eyebee
    logging:
      options:
        max-size: "50m"

  webrtc-sessions:
    image: node:20-alpine
    container_name: webrtc-sessions
    restart: always
    working_dir: /app
    volumes:
      - ./webrtc_sessions:/app
      - ./secrets:/app/secrets:ro
    environment:
      - NODE_ENV=production
      - PORT=5000
      - SERVICE_NAME=webrtc_sessions
      - FIREBASE_CREDENTIALS_PATH=/app/secrets/firebase-credentials.json
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-eyebee-718a0}
      - FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET:-eyebee-718a0.appspot.com}
      - LOG_LEVEL=info
      - VIRTUAL_HOST=${API_DOMAIN:-api.live.eyebee.com}
      - VIRTUAL_PORT=5000
      - LETSENCRYPT_HOST=${API_DOMAIN:-api.live.eyebee.com}
    command: sh -c "npm ci --only=production && node index.js"
    expose:
      - "5000"
    networks:
      - eyebee
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      options:
        max-size: "50m"

  speed-test:
    image: node:20-alpine
    container_name: speed-test
    restart: always
    working_dir: /app
    volumes:
      - ./speed_test_server:/app
    environment:
      - PORT=5100
      - SERVICE_NAME=speed_test_server
      - VIRTUAL_HOST=${SPEEDTEST_DOMAIN:-speedtest.live.eyebee.com}
      - VIRTUAL_PORT=5100
      - LETSENCRYPT_HOST=${SPEEDTEST_DOMAIN:-speedtest.live.eyebee.com}
    command: sh -c "npm ci --only=production && node index.js"
    expose:
      - "5100"
    networks:
      - eyebee
    logging:
      options:
        max-size: "50m"

  web-app:
    image: nginx:alpine
    container_name: eyebee-web
    restart: always
    volumes:
      - ./eyebee_web_app/build:/usr/share/nginx/html:ro
    environment:
      - VIRTUAL_HOST=${DOMAIN:-live.eyebee.com}
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=${DOMAIN:-live.eyebee.com}
    expose:
      - "80"
    networks:
      - eyebee
    depends_on:
      - webrtc-sessions
    logging:
      options:
        max-size: "50m"

networks:
  eyebee:
    driver: bridge
