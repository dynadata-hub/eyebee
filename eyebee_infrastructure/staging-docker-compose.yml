  #   expose:
  #     - "80"
  #   networks:
  #     - eyebee
  #   logging:
  #     options:
  #       max-size: "50m"

  admin_api:
    image: node:14.16.0-alpine
    container_name: "admin-api"
    restart: always
    expose:
      - "3001"
    working_dir: /src
    volumes:
      - /home/ubuntu/immersive/lowtranfer/frander/latency-live-api/api:/src
    environment:
      - SERVICE_NAME=admin_api
      - PORT=3001
    command: "tail -f /dev/null"
    logging:
      options:
        max-size: "50m"
    networks:
      - eyebee

#quiza un bloque de auth

  webrtc_sessions:
    image: node:14.16.0-alpine
    container_name: "webrtc_sessions"
    restart: always
    expose:
      - "5000"
    working_dir: /src
    volumes:
      - /home/ubuntu/eye_bee/webrtc-sessions:/src
    environment:
      - SERVICE_NAME=webrtc_sessions
      - PORT=5000
    command: "node index.js"
    logging:
      options:
        max-size: "50m"
    networks:
      - eyebee

