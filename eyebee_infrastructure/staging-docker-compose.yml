#variante del dev-docker-compose.yml con parametros adaptados al server de livelatency (servidor staging)

version: '2'
services:

  proxy:
    image: jwilder/nginx-proxy:0.8.0
    container_name: "proxy"
    restart: always
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - /etc/letsencrypt/live/livelatency.com/fullchain.pem:/etc/nginx/certs/livelatency.com.crt
      - /etc/letsencrypt/live/livelatency.com/privkey.pem:/etc/nginx/certs/livelatency.com.key
    networks:
      - eyebee
    logging:
      options:
        max-size: "50m"

  web-apps:
    image: nginx:1.19.8-alpine
    container_name: "web-apps"
    restart: always
    volumes:
      - /home/ubuntu/eye_bee/eyebee-web-app/build:/app
      - /home/ubuntu/immersive/lowtranfer/frander/latency-live/build:/admin_app
      - /home/ubuntu/eye_bee/eyebee-web-app/nginx_default.conf:/etc/nginx/conf.d/default.conf
    environment:
      - VIRTUAL_HOST=livelatency.com
    working_dir: /app
    expose:
      - "80"
    networks:
      - eyebee
    logging:
      options:
        max-size: "50m"

  # admin_app:
  #   image: nginx:1.19.8-alpine
  #   container_name: "admin-app"
  #   restart: always
  #   volumes:
  #     - /home/ubuntu/immersive/lowtranfer/frander/latency-live/build:/app
  #     - /home/ubuntu/eye_bee/admin_app/nginx_default.conf:/etc/nginx/conf.d/default.conf
