version: '2'
services:

  proxy:
    image: jwilder/nginx-proxy:0.8.0
    container_name: "proxy"
    restart: always
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - eyebee
    logging:
      options:
        max-size: "50m"

  web-apps:
    image: nginx:1.19.8-alpine
    container_name: "web-apps"
    restart: always
    volumes:
      - /root/eyebee-web-app/build:/app
      - /root/eyebee-web-app/nginx_default.conf:/etc/nginx/conf.d/default.conf
    environment:
      - VIRTUAL_HOST=192.168.0.200
    working_dir: /app
    expose:
      - "80"
    networks:
      - eyebee
    logging:
      options:
        max-size: "50m"

#quiza un bloque de auth

  webrtc_sessions:
    image: node:20-alpine
    container_name: "webrtc_sessions"
    restart: always
    expose:
      - "5000"
    working_dir: /src
    volumes:
      - /root/webrtc-sessions:/src
    environment:
      - SERVICE_NAME=webrtc_sessions
      - PORT=5000
    command: "node index.js"
    logging:
      options:
        max-size: "50m"
    networks:
      - eyebee

